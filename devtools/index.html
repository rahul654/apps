<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Developer utilities that run entirely in your browser: JSON, Base64, URL, JWT, timestamps, regex, cron, UUID, hashes, diff and converters." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>" />
    <title>Dev Tools</title>
    <script>
      // Apply a saved theme override before first paint (only the theme preference is read here).
      try {
        var t = JSON.parse(localStorage.getItem('devtools:prefs:v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
